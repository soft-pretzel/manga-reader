name: manga_reader
description: "A new Flutter project."
publish_to: "none"
version: 0.10.0

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  path_provider: ^2.1.6
  dynamic_color: ^2.1.0
  provider: ^6.1.5+1
  go_router: ^18.1.4
  unseal: ^1.3.0
  shared_preferences: ^2.5.6
  sqflite: ^2.4.6
  http: ^1.6.0
  uuid: ^4.6.0
  file_picker: ^13.4.0
  saf_util: ^3.1.1
  saf_stream: ^4.0.3
  package_info_plus: ^10.2.2
  screen_brightness: ^2.1.11
  url_launcher: ^6.3.3
  filesize: ^2.0.1
  xml: ^7.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  adaptive_icon_background: "#534c6a"
  adaptive_icon_foreground: "assets/icon.png"
  android: true
  image_path: "assets/icon.png"
  ios: true
  remove_alpha_ios: true
